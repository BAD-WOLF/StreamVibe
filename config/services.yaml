# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  # NOTA (out/2026): remetente dos emails (confirmação de cadastro e troca
  # de senha). Estava repetido como texto fixo no RegisterUserUseCase e no
  # ResetUserPasswordUseCase.
  app.mailer.sender_address: 'noreply@streamvibe.com'
  app.mailer.sender_name: 'StreamVibe'

  # NOTA (nov/2026): nível mínimo do log em arquivo (var/log/<ambiente>.log,
  # App\Infrastructure\Logging\FileLogger), o que o painel do sistema lê:
  # info em dev e test, warning em prod (when@prod no fim deste arquivo). A
  # variável de ambiente LOG_LEVEL, quando existe, vale mais que este.
  app.log.level: info

services:

  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  # NOTA (out/2026): o exclude apontava para ../src/DependencyInjection/,
  # que não existe — o compiler pass fica em
  # src/Infrastructure/DependencyInjection/ e virava serviço à toa.
  App\:
    resource: "../src/"
    exclude:
      - "../src/Infrastructure/DependencyInjection/"
      - "../src/Domain/*/Entity/"
      - "../src/Kernel.php"

  # ---------------------------------------------------------------------
  # Portas (interfaces do Domain e do Application) -> adaptadores
  # (Infrastructure).
  #
  # NOTA (out/2026): os repositórios eram declarados com `class:`, o que
  # criava um SEGUNDO serviço com a mesma classe (o do `App\:` acima e o
  # da interface). Com `alias:`, interface e classe são o mesmo serviço.
  # As portas novas (gateway do TMDB, imagem, verificação de email, troca
  # de senha, refresh tokens) ficam explícitas aqui — o autowiring até
  # resolveria uma interface com uma implementação só, mas assim a troca
  # de adaptador é uma linha neste arquivo.
  # ---------------------------------------------------------------------

  # Domain
  App\Domain\User\Repository\UserRepositoryInterface:
    alias: App\Infrastructure\Persistence\Repository\UserRepository

  App\Domain\Authentication\Repository\ResetPasswordSolicitationRepositoryInterface:
    alias: App\Infrastructure\Persistence\Repository\ResetPasswordSolicitationRepository

  # NOTA (nov/2026): o log de auditoria da administração de contas.
  App\Domain\Audit\Repository\AuditLogRepositoryInterface:
    alias: App\Infrastructure\Persistence\Repository\AuditLogRepository

  # Application
  App\Application\Shared\Gateway\MovieDatabaseGatewayInterface:
    alias: App\Infrastructure\ExternalServices\TmdbApiService

  App\Application\Image\Port\ImageProcessorInterface:
    alias: App\Infrastructure\Image\GdImageProcessor

  App\Application\Authentication\Port\EmailVerificationInterface:
    alias: App\Infrastructure\Security\EmailVerifier

  App\Application\Authentication\Port\PasswordResetInterface:
    alias: App\Infrastructure\Security\PasswordResetManager

  App\Application\Authentication\Port\RefreshTokenRevokerInterface:
    alias: App\Infrastructure\Security\RefreshTokenRevoker

  # NOTA (nov/2026): administração de contas.
  App\Application\Admin\Port\UserSessionsInterface:
    alias: App\Infrastructure\Security\RefreshTokenSessions

  # NOTA (nov/2026): painel do sistema (ROLE_DEV). O TmdbApiService é
  # também a porta de conferência do TMDB: o HttpClient continua só nele.
  App\Application\Shared\Port\SecretMaskerInterface:
    alias: App\Infrastructure\Security\SecretMasker

  App\Application\System\Port\ServerInspectorInterface:
    alias: App\Infrastructure\System\ProcServerInspector

  App\Application\System\Port\RuntimeInspectorInterface:
    alias: App\Infrastructure\System\PhpRuntimeInspector

  App\Application\System\Port\ProcessInspectorInterface:
    alias: App\Infrastructure\System\ProcProcessInspector

  App\Application\System\Port\DatabaseInspectorInterface:
    alias: App\Infrastructure\Persistence\DoctrineDatabaseInspector

  App\Application\System\Port\MovieDatabaseProbeInterface:
    alias: App\Infrastructure\ExternalServices\TmdbApiService

  App\Application\System\Port\LogReaderInterface:
    alias: App\Infrastructure\Logging\LogFileReader

  # SymfonyCasts ResetPassword bundle interface binding
  SymfonyCasts\Bundle\ResetPassword\Persistence\ResetPasswordRequestRepositoryInterface:
    alias: App\Infrastructure\Persistence\Repository\ResetPasswordSolicitationRepository

  # ---------------------------------------------------------------------
  # Adaptadores que precisam de configuração
  # ---------------------------------------------------------------------

  # TMDB API Service configuration
  App\Infrastructure\ExternalServices\TmdbApiService:
    arguments:
      $tmdbToken: "%env(TMDB_TOKEN)%"

  # NOTA (nov/2026): $frontendDomain — o link de confirmação leva ao front.
  App\Infrastructure\Security\EmailVerifier:
    arguments:
      $senderAddress: "%app.mailer.sender_address%"
      $senderName: "%app.mailer.sender_name%"
      $frontendDomain: "%env(FRONTEND_UI_DOMAIN)%"

  App\Infrastructure\Security\PasswordResetManager:
    arguments:
      $senderAddress: "%app.mailer.sender_address%"
      $senderName: "%app.mailer.sender_name%"

  # NOTA (nov/2026): o logger da aplicação. Decora o logger padrão do
  # Symfony (sem o MonologBundle, ele só escreve no stderr, do nível error
  # para cima) — que continua escrevendo lá e alimentando o profiler — e
  # grava também em var/log/<ambiente>.log, o arquivo que o painel do
  # sistema lê.
  App\Infrastructure\Logging\FileLogger:
    decorates: logger
    arguments:
      $inner: "@.inner"
      $logsDir: "%kernel.logs_dir%"
      $environment: "%kernel.environment%"
      $minLevel: "%env(default:app.log.level:LOG_LEVEL)%"

  # NOTA (nov/2026): painel do sistema (ROLE_DEV).
  App\Infrastructure\Logging\LogFileReader:
    arguments:
      $logsDir: "%kernel.logs_dir%"

  App\Infrastructure\System\PhpRuntimeInspector:
    arguments:
      $environment: "%kernel.environment%"
      $debug: "%kernel.debug%"
      $bundles: "%kernel.bundles%"

  App\Infrastructure\Persistence\DoctrineDatabaseInspector:
    arguments:
      $migrations: "@doctrine.migrations.dependency_factory"

  # NOTA (nov/2026): os segredos que o SecretMasker esconde pelo valor nas
  # mensagens que saem pelo painel do sistema. Resolvidos como o resto da
  # aplicação os resolve (.env ou cofre); um que não existe vira null.
  App\Infrastructure\Security\SecretMasker:
    arguments:
      $secrets:
        APP_SECRET: "%env(default::APP_SECRET)%"
        DATABASE_URL: "%env(default::DATABASE_URL)%"
        JWT_PASSPHRASE: "%env(default::JWT_PASSPHRASE)%"
        MAILER_DSN: "%env(default::MAILER_DSN)%"
        SENTRY_DSN: "%env(default::SENTRY_DSN)%"
        TMDB_TOKEN: "%env(default::TMDB_TOKEN)%"

  # NOTA (nov/2026): contagem das tentativas de login no pool próprio
  # (config/packages/cache.yaml), separada do cache.app de uso geral. Os
  # listeners de login (LoginThrottlingListener) e de headers de segurança
  # (SecurityHeadersListener) se registram pelo atributo #[AsEventListener].
  App\Infrastructure\Security\LoginAttemptLimiter:
    arguments:
      $cache: "@cache.login_throttling"

  # Exception Listener configuration
  App\Infrastructure\Http\EventListener\ExceptionListener:
    arguments:
      $debug: "%kernel.debug%"
    tags:
      - name: kernel.event_listener
        event: kernel.exception
        method: onKernelException

  # Output Mapper Registry configuration (mappers auto-discovered via attributes)
  App\Infrastructure\ApiPlatform\Shared\Mapper\OutputMapperRegistry:
    arguments:
      $mappers: !tagged_iterator "app.output_mapper"

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones

# NOTA (nov/2026): em produção o log em arquivo fica do warning para cima
# (ver app.log.level, no começo deste arquivo).
when@prod:
  parameters:
    app.log.level: warning
