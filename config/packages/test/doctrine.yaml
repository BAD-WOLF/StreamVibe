doctrine:
  dbal:
    # Use PostgreSQL test database
    dbname_suffix: "_test"

    # Enable logging for debugging test failures
    logging: true
    profiling: true
    profiling_collect_backtrace: true

  orm:

    # Validate XML mapping
    validate_xml_mapping: true

    # Use underscore naming strategy
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware

    # Auto mapping enabled
    auto_mapping: true

    # NOTA (out/2026): o bloco "mappings" que existia aqui repetia o de
    # config/packages/doctrine.yaml com type: attribute. Como os arquivos
    # são mesclados, ele sobrescreveria o mapeamento novo em XML (as
    # entidades do Domain não têm mais atributos #[ORM\...]) e o ambiente
    # de teste ficaria sem entidades. Sem o bloco, o teste usa exatamente o
    # mesmo mapeamento da aplicação.

    # Disable query cache for tests
    query_cache_driver:
      type: null

    # Disable result cache for tests
    result_cache_driver:
      type: null

    # Default repository class
    default_repository_class: Doctrine\ORM\EntityRepository

    # Quote strategy
    quote_strategy: doctrine.orm.quote_strategy.default

    # Enable strict mode for better test validation
    dql:
      string_functions:
        # Add any custom DQL functions if needed
      numeric_functions:
        # Add any custom numeric functions if needed
      datetime_functions:
        # Add any custom datetime functions if needed
