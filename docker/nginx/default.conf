server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /app/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NOTA (out/2026): as rotas da API são /{_locale}/api/... (en, pt_BR,
    # es — config/routes/api_platform.yaml); só o login_check ficou em
    # /api. Os dois blocos abaixo eram "location /api/" e
    # "~ ^/api/(register|login|reset-password)" e só pegavam o
    # /api/login_check: o limite de requisições não valia para o resto da
    # API. Além disso o bloco de arquivos estáticos (regex) ganhava do
    # prefixo /api/, e uma URL de imagem como /en/api/image/w500/x.jpg ia
    # parar no disco em vez do Symfony. Agora são regex com o locale
    # opcional, antes do bloco de estáticos (no nginx o primeiro regex que
    # casa vence), e o de autenticação vem antes do geral. Ficam entre
    # aspas porque têm chaves ({2}), que o nginx leria como bloco. O
    # resend-verification entrou no limite de autenticação (manda email,
    # como o reset-password).

    # Rate limiting for authentication endpoints
    location ~ "^/(?:[a-z]{2}(?:_[A-Z]{2})?/)?api/(?:register|login|reset-password|resend-verification)" {
        limit_req zone=login burst=5 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    # Rate limiting for API endpoints
    location ~ "^/(?:[a-z]{2}(?:_[A-Z]{2})?/)?api/" {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ ^/(\.env|composer\.(json|lock)|symfony\.lock|\.git|\.gitignore|README\.md|docker|tests|var) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # PHP handling
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS off;

        # Increase timeouts for API operations
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # Buffer sizes
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        internal;
    }

    # Default try_files for Symfony routing
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Return 404 for all other php files not matching the front controller
    location ~ \.php$ {
        return 404;
    }

    # NOTA (out/2026): saiu o "location /health" que respondia "healthy"
    # direto do nginx — dava 200 mesmo com o PHP-FPM ou o Symfony fora do
    # ar. Agora /health cai no "location /" e chega ao HealthCheckController
    # (GET /health, {"status":"ok"}): 200 quer dizer nginx + FPM + app.

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

