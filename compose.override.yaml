services:
  ###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432:5432"
    volumes:
      # Bind mount for easier database inspection in development
      - ./docker/db/data:/var/lib/postgresql/data:rw
  ###< doctrine/doctrine-bundle ###

  ###> symfony/mailer ###
  mailer:
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"
  ###< symfony/mailer ###

  app:
    environment:
      APP_ENV: dev
      MAILER_DSN: smtp://mailer:1025
      # Enable Symfony debugging in development
      APP_DEBUG: "1"
      # Override for development with no-dev disabled
    build:
      args:
        COMPOSER_NO_DEV: "0"
    volumes:
      # Mount source code for live development
      - ./src:/app/src:rw
      - ./config:/app/config:rw
      - ./templates:/app/templates:rw
      - ./translations:/app/translations:rw
      # Mount vendor for access (if enable execute 'composer install' again)
      # - ./vendor:/app/vendor:rw
    depends_on:
      database:
        condition: service_healthy
      mailer:
        condition: service_started

  ###> Development tools ###
